<style>:root{--gold:#ffd34a;--txt:#f1e6cf;--mut:#a8977c;--grn:#5cd65c;--red:#e2443c;--blu:#4ab0ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#09080c;color:var(--txt);font-family:'VT323',monospace;font-size:20px;line-height:1.05;overflow:hidden;touch-action:manipulation}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#app{max-width:540px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:#14131a var(--wall);background-size:64px 32px;box-shadow:0 0 0 2px #000,0 0 40px #000}
.fr{border-style:solid;border-width:12px;border-image:var(--fw) 12 fill / 12px stretch}
.fr.g{border-image:var(--fg) 12 fill / 12px stretch}
.fr.s{border-image:var(--fs) 12 fill / 12px stretch}
.fr.d{border-image:var(--fd) 12 fill / 12px stretch}
header{padding:0 4px;margin:4px 4px 0}
#logo{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:-4px}
#logo img{width:24px;height:24px}
#title{font-family:'Press Start 2P',monospace;font-size:13px;color:var(--gold);letter-spacing:1px;text-shadow:2px 0 #8a2a0a,-2px 0 #8a2a0a,0 2px #8a2a0a,0 -2px #8a2a0a,2px 2px #8a2a0a,-2px -2px #8a2a0a,2px -2px #8a2a0a,-2px 2px #8a2a0a,3px 4px 0 #120818}
#title b{color:#6fc8ff;text-shadow:2px 0 #10285a,-2px 0 #10285a,0 2px #10285a,0 -2px #10285a,2px 2px #10285a,-2px -2px #10285a,3px 4px 0 #120818}
.res{display:flex;gap:4px;margin-top:4px}
.chip{flex:1;display:flex;align-items:center;gap:3px;background:linear-gradient(#0e0b09,#1c1510);border:2px solid #000;box-shadow:inset 0 0 0 1px #5a3c22;padding:0 5px;font-size:19px;white-space:nowrap;height:24px}
.chip img{width:16px;height:16px}.chip span{flex:1;text-align:right}
.chip.set{flex:0 0 28px;justify-content:center;cursor:pointer}
#sbar{display:flex;align-items:center;gap:4px;padding:4px 6px 0}
#stg{flex:1;background:linear-gradient(#0e0b09,#1c1510);border:2px solid #000;box-shadow:inset 0 0 0 1px #5a3c22;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:19px}
#stg .bio{color:var(--mut)}
#battle{margin:3px 4px 0}
#bwrap{position:relative;line-height:0;margin:-4px}
#cv{width:100%;display:block;aspect-ratio:208/117;background:#000}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ftx{position:absolute;transform:translate(-50%,-100%);font-family:'Press Start 2P';font-size:8px;white-space:nowrap;text-shadow:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000,1px 1px 0 #000;animation:up 1.1s ease-out forwards;line-height:1}
@keyframes up{0%{opacity:0;margin-top:6px}15%{opacity:1}100%{opacity:0;margin-top:-24px}}
.banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:'Press Start 2P';font-size:13px;line-height:1.4;animation:ban 2.3s ease-out forwards}
.banner span{display:inline-block;background:linear-gradient(90deg,transparent,#000c 15%,#000c 85%,transparent);padding:6px 30px;text-shadow:2px 2px 0 #000}
@keyframes ban{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.btn{font-family:'VT323',monospace;font-size:20px;color:#fff;background:#3a7a2a;border:none;padding:4px 10px;cursor:pointer;line-height:1;
 box-shadow:inset -2px -3px 0 #1e4214,inset 2px 2px 0 #7ac85a,0 0 0 2px #0a0806,0 3px 0 2px #0a0806;text-shadow:1px 1px 0 #000;margin-bottom:3px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn img{width:14px;height:14px}
.btn:active{transform:translateY(2px);box-shadow:inset 2px 2px 0 #1e4214,0 0 0 2px #0a0806,0 1px 0 2px #0a0806}
.btn.red{background:#a82a22;box-shadow:inset -2px -3px 0 #4a120e,inset 2px 2px 0 #e2645a,0 0 0 2px #0a0806,0 3px 0 2px #0a0806}
.btn.blu{background:#2a52a8;box-shadow:inset -2px -3px 0 #12244a,inset 2px 2px 0 #6a96f0,0 0 0 2px #0a0806,0 3px 0 2px #0a0806}
.btn.gld{background:#c08414;color:#fff8e0;box-shadow:inset -2px -3px 0 #6a4206,inset 2px 2px 0 #ffe27a,0 0 0 2px #0a0806,0 3px 0 2px #0a0806}
.btn.pur{background:#7030a8;box-shadow:inset -2px -3px 0 #361250,inset 2px 2px 0 #b07ae8,0 0 0 2px #0a0806,0 3px 0 2px #0a0806}
.btn.gry{background:#4a4650;box-shadow:inset -2px -3px 0 #26242a,inset 2px 2px 0 #7a7680,0 0 0 2px #0a0806,0 3px 0 2px #0a0806}
.btn.dis,.btn:disabled{filter:grayscale(1) brightness(.55);pointer-events:none}
.btn.sm{font-size:18px;padding:3px 8px}
#party{display:flex;gap:4px;padding:4px 4px 0}
.pb{flex:1;display:flex;gap:3px;align-items:center;background:linear-gradient(#0e0b09,#1c1510);border:2px solid #000;box-shadow:inset 0 0 0 1px #3a2a1a;padding:2px 4px 2px 2px;min-width:0}
.pb img{width:30px;height:30px;background:#2a1d14;border:1px solid #5a3c22}
.pb .bars{flex:1;min-width:0}.pb .nm{font-size:15px;white-space:nowrap;overflow:hidden;line-height:.9;color:#d8c8a8}
.bar{height:6px;background:#2a1010;border:1px solid #000;margin:1px 0;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#8aff8a,#3aa83a)}
.bar.xp{height:4px}.bar.xp>i{background:linear-gradient(#8fd8ff,#2a7ad8)}
#panel{flex:1;overflow-y:auto;padding:6px 4px 10px;-webkit-overflow-scrolling:touch}
.pnl{margin-bottom:8px;padding:2px 4px 4px}
h3{display:inline-block;font-family:'Press Start 2P';font-size:9px;color:#3a1e06;background:linear-gradient(#fff0a8,#e8b030 55%,#c08414);padding:5px 12px 4px;margin:-4px 0 8px -4px;text-shadow:1px 1px 0 #fff4c0;
 clip-path:polygon(0 0,100% 0,calc(100% - 6px) 50%,100% 100%,0 100%,6px 50%);box-shadow:0 2px 0 #000;letter-spacing:.5px}
h3 span{color:#7a3a06}
.mut{color:var(--mut)}.g{color:var(--gold)}.gr{color:var(--grn)}.rd{color:#ff6a5a}.bl{color:#6fc8ff}
.row{display:flex;gap:6px;align-items:center}.sp{flex:1}
nav{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px 6px 8px;background:linear-gradient(#2a1d14,#14100c);border-top:2px solid #000;box-shadow:inset 0 2px 0 #7a5230}
nav button{background:linear-gradient(#3a2818,#22170f);border:none;color:var(--txt);font-family:'VT323';font-size:14px;padding:4px 0 2px;cursor:pointer;
 box-shadow:inset 0 0 0 2px #8a5a2c,inset 0 0 0 3px #1a120c,0 0 0 2px #000;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
nav button img{width:30px;height:30px;filter:drop-shadow(0 2px 0 #000)}
nav button.on{background:linear-gradient(#6a4418,#3a2410);box-shadow:inset 0 0 0 2px var(--gold),inset 0 0 0 3px #1a120c,0 0 0 2px #000,0 0 10px #ffc83a66;color:var(--gold)}
.dot{position:absolute;top:2px;right:3px;width:9px;height:9px;background:#ff3a3a;box-shadow:0 0 0 2px #000,inset -1px -1px 0 #a01a1a,inset 1px 1px 0 #ff9a8a;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
/* hero select */
.hsel{display:flex;gap:5px;margin-bottom:8px}
.hc{flex:1;position:relative;cursor:pointer;background:linear-gradient(#1e1610,#120d09);border:2px solid #000;box-shadow:inset 0 0 0 2px #4a3420;padding:4px 2px 3px;text-align:center}
.hc.on{box-shadow:inset 0 0 0 2px var(--gold),0 0 10px #ffc83a55;background:linear-gradient(#3a2814,#1a120c)}
.hc img{width:40px;height:40px;display:block;margin:0 auto 1px}
.hc b{display:block;font-weight:normal;font-size:17px;color:#fff;line-height:.95}
.hc small{font-size:15px;color:var(--mut);display:block;line-height:.95}
.hc.add .plus{font-family:'Press Start 2P';font-size:20px;color:var(--gold);padding:8px 0 4px;text-shadow:2px 2px 0 #000}
/* showcase */
.show{padding:4px 2px 6px;text-align:center}
.sh-top{display:grid;grid-template-columns:62px 1fr 62px;align-items:center;gap:2px}

/* ================= UTIL ================= */
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(R(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const EZ={out:t=>1-(1-t)**3,io:t=>t<.5?4*t*t*t:1-(-2*t+2)**3/2,back:t=>{const c=1.7;return 1+(c+1)*(t-1)**3+c*(t-1)**2}};
const TAU=Math.PI*2;
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function srand(seed){let s=Math.abs(Math.floor(seed))%2147483646+1;return()=>(s=s*16807%2147483647)/2147483647}
/* ================= COLOR ================= */
function h2r(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}

 if(s.d)p.push(`causa ${Math.round(s.d*m*100)}% do ATQ${s.hits?` em ${s.hits} golpes`:''} ${s.t==='a'?'a todos os inimigos':'ao inimigo da frente'}`);
 if(s.c)p.push('sempre crítico');if(s.dot)p.push(`dano contínuo de ${Math.round(s.dot[0]*m*100)}% ATQ/s por ${s.dot[1]}s${!s.d&&s.t==='a'?' em todos':''}`);
 if(s.st)p.push(`atordoa por ${s.st}s`);if(s.ls)p.push(`rouba ${pct(s.ls)} do dano como vida`);if(s.rev)p.push('revive aliados caídos com 50% de vida');
 if(s.h)p.push(`cura o grupo em ${Math.round(s.h*m*100)}% do ATQ`);if(s.sh)p.push(`escudo de ${Math.round(s.sh*m*100)}% da VIDA em todo o grupo`);
 if(s.b)p.push(`${s.b[3]==='p'?'o grupo ganha':'ganha'} +${Math.round(s.b[1]*bm*100)}% ${STN[s.b[0]]} por ${s.b[2]}s`);
 const t=p.join(', ');return t.charAt(0).toUpperCase()+t.slice(1)+`. Recarga: ${s.cd}s.`}

let last=performance.now(),acc=0,hidT=0,saveT=0;
function loop(t){const dt=Math.min(.1,(t-last)/1000);last=t;
 if(S.heroes.length){const step=dt*S.opt.spd,n=Math.ceil(step/.02);for(let i=0;i<n;i++)update(step/n)}else T+=dt;
 ambient(dt);draw();if(tab==='herois')drawPreview();
 acc+=dt;saveT+=dt;if(acc>.25){acc=0;hud();if((panelDirty&&tab!=='social')||(invDirty&&tab==='inv'))renderPanel()}if(saveT>10){saveT=0;save();syncProfile()}
 requestAnimationFrame(loop)}

 if(keysNow()<KEYMAX)list.push({id:2,title:'Chaves recarregadas',body:'Suas chaves de masmorra estão cheias!',schedule:{at:new Date(S.keyT+(KEYMAX-S.keys)*KEYREG)}});if(S.inv.length>=S.bag-5)list.push({id:3,title:'Bolsa quase cheia',body:'Venda ou desmonte itens para não perder loot.',schedule:{at:new Date(Date.now()+36e5)}});
 (LN.requestPermissions?LN.requestPermissions():Promise.resolve()).catch(()=>{}).then(()=>LN.cancel({notifications:[{id:1},{id:2},{id:3}]})).catch(()=>{}).finally(()=>LN.schedule({notifications:list}).catch(()=>{}))}catch(e){}}

/* ---- helpers ---- */
const dayKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function weekKey(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);const fy=new Date(Date.UTC(t.getUTCFullYear(),0,4));return t.getUTCFullYear()+'w'+(1+Math.round(((t-fy)/864e5-3+((fy.getUTCDay()+6)%7))/7))}
function curEvent(){const d=new Date().getDay();if(!(d===5||d===6||d===0))return null;return EVS[parseInt(weekKey().split('w')[1])%EVS.length]}
let MB=null;
function metaBonus(){if(MB)return MB;const b={atk:0,hp:0,def:0,gold:0,xp:0,luck:0,cdmg:0,aspd:0,crit:0,drop:0,forge:0,off:0,heal:0};
 if(typeof S==='undefined'||!S.rn)return b;
 for(const id in S.rn)if(RUNES[id])b[RUNES[id].k]+=RUNES[id].v*S.rn[id];
 if(S.pet&&S.pets[S.pet])b[PETS[S.pet].k]+=petVal(S.pet);
 const nt=Object.keys(S.troph).length;b.atk+=.01*nt;b.hp+=.01*nt;
 for(const id in S.best){const k=S.best[id];if(k>=50)b.gold+=.005;if(k>=500)b.atk+=.005}
 return MB=b}
const mbDirty=()=>{MB=null};
function dayRoll(){const k=dayKey();if(!S.day||S.day.d!==k)S.day={d:k,drops:0}}
const dropCap=()=>50+metaBonus().drop;
function dropsLeft(){dayRoll();return dropCap()-S.day.drops}
function onKill(e){const d=e.d,id=d.id;if(!id)return;S.best[id]=(S.best[id]||0)+1;const k=S.best[id];if(k===50||k===500){mbDirty();rebuildParty()}
 if(S.ev&&S.ev.id){if(e.boss)S.ev.p.bosses=(S.ev.p.bosses||0)+1;S.ev.p.kills=(S.ev.p.kills||0)+1}
 if(S.ch||id==='colosso')return;const ev=curEvent()||{};
 let ch=e.boss?1/15:e.rk===2?1/30:e.rk===1?1/80:1/300;ch*=(1+metaBonus().luck)*(e.boss&&ev.boss?2:1);
 if(Math.random()<ch){const first=!S.troph[id];S.troph[id]=(S.troph[id]||0)+1;if(first){mbDirty();rebuildParty();toast(`<img src="${urlOf(monFrames(d).port)}" class="ti"> Troféu: <b class="g">${trophName(d)}</b>!`);SND.play('rare');checkRegionSets()}}
 if(e.boss&&Math.random()<(1/150)*(ev.cos||1))giveCos(null);
 if(e.boss&&Math.random()<1/40){S.eggs++;toast(`<img src="${icon('egg','#f0e8d0')}" class="ti"> Você achou um Ovo de Pet!`)}}
function checkRegionSets(){BIO.forEach((b,i)=>{if(S.regDone[i])return;if(b.en.concat(b.boss).every(m=>S.troph[m])){S.regDone[i]=1;S.gems+=20;giveCos(b.cos);toast(`Bestiário de <b>${b.n}</b> completo! +20 gemas`)}})}
function giveCos(id,silent){const pool=Object.keys(COS).filter(k=>!S.cos.includes(k)&&k!=='auraArco');if(!id){if(!pool.length){S.gems+=10;return}id=pick(pool)}if(S.cos.includes(id)){S.gems+=10;return}S.cos.push(id);if(!silent){toast(`Novo visual: <b class="g">${COS[id].n}</b> (${COS[id].d})!`);SND.play('legend')}}
/* ---- pets ---- */
function hatchEgg(){if(S.eggs<1)return;S.eggs--;const id=pick(Object.keys(PETS));let txt;if(!S.pets[id]){S.pets[id]={s:1,l:1,sh:0};if(!S.pet)S.pet=id;txt=`Novo pet: <b class="g">${PETS[id].n}</b>!`}else{S.pets[id].sh++;txt=`${PETS[id].n} repetido: +1 fragmento de evolução`}
 mbDirty();rebuildParty();reveal('Ovo de Pet',icon('egg','#f0e8d0'),[{r:Math.min(5,S.pets[id].s+1),html:`<img src="${urlOf(petFrames(id)[0])}" style="width:64px;height:64px"><div>${txt}</div>`}]);save()}

const revItem=it=>({r:it.r,html:`<div class="it r${it.r}" style="margin:0 auto">${`<img src="${itemIcon(it)}">`}</div><div class="c${it.r}">${it.n}</div>`});
/* ---- desafios: masmorra, torre, chefe de guilda ---- */
function chStart(c){if(S.ch)return false;S.ch=c;B.heroes.forEach(u=>{u.dead=false;u.hp=u.st.hp;u.act=null;u.buffs=[];u.shield=0});B.scroll+=60;spawnWave();renderPanel();return true}
function reviveHalf(){B.heroes.forEach(u=>{if(u.dead){u.dead=false;u.hp=u.st.hp*.3}})}
function chClear(){const c=S.ch;
 if(c.k==='dun'){if(c.w>=DW){dunWin();return}c.w++;reviveHalf();spawnWave();return}
 if(c.k==='tw'){const L=curL();if(c.f>S.tw.max){S.tw.max=c.f;const g=goldKill(L)*20;S.gold+=g;c.gold+=g;if(c.f%10===0){S.gems+=5;c.gems+=5;const it=mkItem(pick(SLOTS),rollRar(2,3),L);addItem(it,true);c.items.push(it);if(Math.random()<.3){S.eggs++;c.eggs++}if(c.f===100)giveCos('auraArco')}}
  c.f++;c.t=c.T;reviveHalf();spawnWave();return}
 chEnd('time')}
function chEnd(why){const c=S.ch;if(!c)return;S.ch=null;B.heroes.forEach(u=>{u.dead=false;u.hp=u.st.hp;u.act=null;u.buffs=[];u.shield=0});spawnWave();
 if(c.k==='dun'){SND.play('defeat');modal(`<h2>A masmorra venceu...</h2><div style="font-size:18px">Seus heróis recuaram de <b>${DUNS.find(d=>d.id===c.id).n}</b> (dificuldade ${c.lvl}). Fortaleça a equipe e tente de novo.</div><div class="btns"><button class="btn gry" data-a="close">Voltar</button></div>`)}
 if(c.k==='tw'){SND.play('victory');modal(`<h2>Torre Infinita</h2><div style="font-size:19px">Você parou no andar <b class="g">${c.f}</b>. Recorde: <b class="g">${S.tw.max}</b>.<br><br>Recompensas desta subida:<br><img src="${icon('coin','#e8b030')}" class="ti"> ${fmt(c.gold)} ouro · <img src="${icon('gem','#3a8aff')}" class="ti"> ${c.gems} gemas${c.eggs?` · ${c.eggs} ovo(s)`:''}${c.items.map(i=>`<br><img src="${itemIcon(i)}" class="ti"> <span class="c${i.r}">${i.n}</span>`).join('')}</div><div class="btns"><button class="btn gld" data-a="close">OK</button></div>`);syncProfile(true)}
 if(c.k==='gb')gbRecord(c.dmg);
 renderPanel();save()}
function dunStart(id){const d=DUNS.find(x=>x.id===id);if(S.ch)return;if(keysNow()<1)return toast('Sem chaves! Espere a recarga ou compre na Loja.');if(S.maxStage<d.req)return;
 S.keys--;if(S.keys===KEYMAX-1)S.keyT=now();chStart({k:'dun',id,lvl:S.dlv[id]||1,w:1,t:90,T:90});spawnBanner(d.n.toUpperCase(),'#ff9af0');SND.play('boss');save()}
function dunWin(){const c=S.ch,d=DUNS.find(x=>x.id===c.id),lvl=c.lvl,L=curL()+6;S.ch=null;B.heroes.forEach(u=>{u.dead=false;u.hp=u.st.hp;u.act=null;u.buffs=[];u.shield=0});spawnWave();
 S.dlv[d.id]=Math.max(S.dlv[d.id]||1,lvl+1);S.st.dun=(S.st.dun||0)+1;if(S.ev&&S.ev.id)S.ev.p.dun=(S.ev.p.dun||0)+1;const res=[];
 if(d.id==='cofre'){const g=goldKill(L)*120;S.gold+=g;S.st.goldT+=g;res.push({r:3,html:`<img src="${icon('coin','#e8b030')}" style="width:48px;height:48px"><div>+${fmt(g)} ouro</div>`})}
 if(d.id==='torre'){const x=xpKill(L)*90;S.heroes.forEach(h=>gainXp(h,x));res.push({r:3,html:`<img src="${icon('book','#4a7aff')}" style="width:48px;height:48px"><div>+${fmt(x)} XP por herói</div>`})}
 if(d.id==='arsenal'){[0,1,2].forEach(()=>{const i=mkItem(pick(SLOTS),rollRar(2+lvl*.3,2),L);addItem(i,true);res.push(revItem(i))})}
 if(d.id==='abismo'){const gm=8+lvl*2;S.gems+=gm;const anc=Math.random()<Math.min(.4,.04+.025*lvl);const it=mkItem(pick(SLOTS),anc?6:rollRar(4,4),L);addItem(it,true);res.push(revItem(it));res.push({r:2,html:`<img src="${icon('gem','#3a8aff')}" style="width:40px;height:40px"><div>+${gm} gemas</div>`});if(Math.random()<.3){S.eggs++;res.push({r:2,html:`<img src="${icon('egg','#f0e8d0')}" style="width:40px;height:40px"><div>Ovo de Pet</div>`})}}
 reveal(`${d.n}: dificuldade ${lvl} vencida!`,icon('chest','#9a6232'),res);renderPanel();save()}
function towerStart(){chStart({k:'tw',f:S.tw.max+1,t:35,T:35,gold:0,gems:0,items:[],eggs:0});spawnBanner('TORRE INFINITA · ANDAR '+(S.tw.max+1),'#8fd8ff');SND.play('boss')}
/* chefe de guilda (online) */
const GB={hp:0,dmg:[],tot:0,wk:'',loaded:false};
const gbId=()=>S.guild+'_'+weekKey();
function gbFrac(){if(!GB.hp)return 1;return clamp((GB.hp-GB.tot-(S.ch&&S.ch.k==='gb'?S.ch.dmg:0))/GB.hp,0,1)}
async function gbLoad(){if(!NET.ok||!S.guild)return;try{const id=gbId(),wk=weekKey();let d=await NET.db.doc('gboss/'+id).get();
 if(!d.exists){const g=guildInfo(S.guild),mem=g?g.mem:[],avg=mem.length?mem.reduce((a,p)=>a+(p.ms||1),0)/mem.length:S.maxStage,L=Math.max(60,avg*10);const hp=15*EG**L*12*40*Math.max(1,mem.length);await NET.db.doc('gboss/'+id).set({g:S.guild,wk,hp,ts:Date.now()});d=await NET.db.doc('gboss/'+id).get()}
 GB.hp=(d.data()||{}).hp||0;const q=await NET.db.collection('gdmg').where('g','==',S.guild).where('wk','==',wk).get();GB.dmg=q.docs.map(x=>x.data()).sort((a,b)=>b.dmg-a.dmg);GB.tot=GB.dmg.reduce((a,x)=>a+(x.dmg||0),0);GB.wk=wk;GB.loaded=true}catch(e){}socialDirty()}
function gbAttLeft(){if(!S.gbAtt||S.gbAtt.d!==dayKey())S.gbAtt={d:dayKey(),n:0};return 3-S.gbAtt.n}
function gbStart(){if(!NET.ok||!S.guild)return;if(gbAttLeft()<1)return toast('Sem ataques hoje. Volte amanhã!');if(GB.hp&&GB.tot>=GB.hp)return toast('O chefe já foi derrotado esta semana!');if(chStart({k:'gb',t:30,T:30,dmg:0})){spawnBanner('CHEFE DA GUILDA','#ff9a1a');tab='herois';renderPanel()}}
async function gbRecord(dmg){S.gbAtt.n++;const wk=weekKey(),ref=NET.db.doc(`gdmg/${S.guild}_${wk}_${NET.uid}`);try{const d=await ref.get(),prev=d.exists?(d.data().dmg||0):0;await ref.set({g:S.guild,wk,u:NET.uid,n:S.nick,dmg:prev+dmg,ts:Date.now()})}catch(e){}
 modal(`<h2>Ataque ao Chefe da Guilda</h2><div style="font-size:19px">Seus heróis causaram <b class="g">${fmt(dmg)}</b> de dano!<br>Ataques restantes hoje: ${gbAttLeft()}/3</div><div class="btns"><button class="btn gld" data-a="close">OK</button></div>`);await gbLoad();save()}
function gbClaim(){const k=gbId();if(S.gbClaim===k||!(GB.hp&&GB.tot>=GB.hp))return;if(!GB.dmg.find(x=>x.u===NET.uid))return toast('Só quem atacou o chefe recebe a recompensa.');S.gbClaim=k;const L=Math.max(60,S.maxStage*10);

 frem:v=>{S.friends=S.friends.filter(x=>x!==v);closeM();syncProfile(true);save();renderPanel()},
 gift:async v=>{if(S.gift[v]===today())return;S.gift[v]=today();try{await NET.db.doc(`gifts/${v}_${NET.uid}_${today()}`).set({to:v,from:NET.uid,n:S.nick,day:today(),ts:Date.now()});toast('Presente enviado!');SND.play('coin')}catch(e){toast('Não foi possível enviar.')}save();renderPanel()},
 claimgifts:async()=>{const n=NET.gifts.length;const g=goldKill(Lv())*40*n;S.gold+=g;for(const x of NET.gifts.slice()){try{await NET.db.doc('gifts/'+x.id).delete()}catch(e){}}toast(`+${fmt(g)} ouro de presentes!`);SND.play('victory');save()},
 gcreate:()=>{if(S.gold<2e4)return toast('Precisa de 20K de ouro.');modal(`<h2>Criar guilda</h2><div>Nome</div><input id="gName" maxlength="18" style="width:100%"><div style="margin-top:6px">Sigla (2–4 letras)</div><input id="gTag" maxlength="4" style="width:100%;text-transform:uppercase"><div class="btns"><button class="btn gld" data-a="gcreateok">Criar (20K)</button><button class="btn gry" data-a="close">Cancelar</button></div>`)},
 gcreateok:async()=>{const n=($('#gName').value||'').trim().slice(0,18),t=($('#gTag').value||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);if(n.length<3||t.length<2)return toast('Nome (3+) e sigla (2+) obrigatórios.');if(S.gold<2e4)return;
  const id='g'+Date.now().toString(36)+ri(100,999);try{await NET.db.doc('guilds/'+id).set({name:n,tag:t,leader:NET.uid,ts:Date.now()});S.gold-=2e4;S.guild=id;S.gcon=0;subGuild();closeM();await syncProfile(true);await refreshPlayers(true);toast('Guilda criada!');SND.play('victory');save()}catch(e){toast('Não foi possível criar.')}},
 gjoin:async v=>{const g=guildInfo(v);if(!g||g.mem.length>=20)return;S.guild=v;S.gcon=0;subGuild();await syncProfile(true);await refreshPlayers(true);toast('Você entrou na guilda '+esc(g.name)+'!');save()},
 gleave:async()=>{S.guild='';S.gcon=0;S.guildLv=0;subGuild();await syncProfile(true);await refreshPlayers(true);save()},
 gdonate:v=>{v=+v;if(S.gold<v)return;S.gold-=v;S.gcon=(S.gcon||0)+v;SND.play('coin');syncProfile(true);refreshPlayers(true);save()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatIn'){const b=document.querySelector('[data-a=send]');if(b)sendChat(b.dataset.v)}});

/* ================= WIKI ================= */
let wikiOpen='inicio';
function wikiSec(){const cl=Object.keys(CLS).map(k=>{const c=CLS[k];return`<div class="wk-c"><img src="${urlOf(heroFrames(heroLook({id:k.length*31+7,cls:k,sub:null,eq:{}})).idle[0])}"><div><b style="color:${c.col}">${c.n}</b> ${c.melee?'(corpo a corpo)':'(à distância)'}<br>${c.desc}<br><span class="mut">Subclasses: ${c.subs.map(s=>`<b>${SUB[s].n}</b> – ${SUB[s].desc}`).join('; ')}</span><br><span class="mut">Armas com afinidade: ${AFF[k].map(t=>ITY.arma[t].n).join(', ')}</span></div></div>`}).join('');
 const rar=RAR.map((r,i)=>`<span class="pill c${i}" style="margin:2px">${r.n} ×${r.m}</span>`).join(' ');
 const trs=Object.keys(TR).map(k=>`<div><img src="${icon(TR[k].i,TR[k].c)}" class="ti"> <b>${TR[k].n}</b>: ${TR[k].d(1)}</div>`).join('');
 const reg=BIO.map((b,i)=>`<div><b class="g">${i*RLEN+1}–${i*RLEN+RLEN}</b> ${b.n} · chefe <span class="rd">${MONS[b.boss].n}</span></div>`).join('');
 return[
 ['inicio','Primeiros passos','star','#ffd34a',`<p>Runa Eterna é um RPG <b>idle</b>: seus heróis lutam sozinhos, o tempo todo. Seu trabalho é deixá-los mais fortes.</p>
  <p><b>1.</b> Escolha uma classe. <b>2.</b> Aprenda habilidades na aba Heróis (cada nível dá 1 Ponto de Habilidade, o PH). <b>3.</b> Equipe os itens que caírem (botão <i>Equipar melhores</i> ajuda). <b>4.</b> Compre melhorias na Loja com ouro. <b>5.</b> Quando travar num chefe, fortaleça-se e volte.</p>
  <p>O jogo continua enquanto está minimizado: ao voltar você recebe o que seus heróis ganharam (até 8 horas). Com a <b>Janela flutuante</b> (Opções ⚙) a batalha fica visível por cima de outros apps, se o aparelho permitir. O <b>Modo compacto</b> mostra só a batalha.</p>`],
 ['batalha','Batalha, ondas e chefes','swords','#cfd6e0',`<p>Cada fase tem 10 ondas. A 10ª é um <b>chefe</b> com tempo limite de 25 segundos. A partir da fase 25 aparecem <b>Elites</b> (mais fortes, 3x ouro) e depois da 100, <b>Campeões</b> (8x ouro e item garantido). Se o tempo acabar, a equipe entra em modo <b>FARM</b>: repete as ondas 1–9 acumulando ouro e XP até você tocar em <b>CHEFE!</b></p>
  <p>Se toda a equipe cair nas primeiras ondas, você recua uma fase. Heróis corpo a corpo ficam na frente e recebem mais golpes; à distância ficam atrás.</p><p>Os inimigos ficam bem mais fortes a cada fase (crescem mais rápido que seus itens), então é normal travar: é a hora de forjar, aprimorar, entrar em masmorras ou renascer.</p>`],
 ['classes','Classes e subclasses','heart','#e2445a',`<p>São <b>8 classes</b>, cada uma com 6 habilidades e 2 subclasses (liberadas no <b>nível 15</b>, com mais 5 habilidades cada, incluindo uma <b>Suprema</b>). Total: 128 habilidades.</p>${cl}`],
 ['equipe','Montando a equipe','crown','#ffd34a',`<p>Você começa com 1 herói. Novas vagas são difíceis de conseguir:</p>${SLOTREQ.slice(1).map((r,i)=>`<div>• <b>${i+2}º herói</b>: fase ${r.st}, ${fmt(r.g)} ouro${r.gm?`, ${r.gm} gemas`:''}${r.p?', e pelo menos 1 renascimento':''}</div>`).join('')}<p>Combine funções: um tanque na frente (Guerreiro, Monge), dano (Mago, Arqueiro, Ladino, Necromante) e suporte (Clérigo, Bardo).</p>`],
 ['skills','Habilidades e PH','book','#4a7aff',`<p>Habilidades <b>ativas</b> (moldura bronze) são usadas sozinhas em combate quando a recarga termina. <b>Passivas</b> (moldura prata) dão atributos permanentes. <b>Supremas</b> (moldura dourada) são as mais fortes, com recarga longa.</p><p>Cada rank extra aumenta o efeito (+22% de dano/cura ou +15% nos bônus). Você pode devolver todos os PH por 10 gemas.</p>`],
 ['atrib','Atributos','shield','#8fa8c8',`${Object.keys(STN).map(k=>`<div><img src="${icon(...STI[k])}" class="ti"> <b>${STN[k]}</b>: ${{atk:'dano de ataques e habilidades',hp:'quanto dano aguenta',def:'reduz o dano recebido',aspd:'ataques por segundo',crit:'chance de golpe crítico',cdmg:'multiplicador do crítico (base 150%)',ls:'parte do dano vira cura',dodge:'chance de evitar um golpe',heal:'aumenta curas'}[k]}</div>`).join('')}<p><b>Poder</b> é um resumo da força do herói, usado no ranking.</p>`],
 ['itens','Equipamentos e raridades','chest','#9a6232',`<p>4 espaços: Arma, Cabeça, Armadura e Acessório. Existem <b>11 tipos de arma</b>, 5 de cabeça, 4 de armadura e 4 acessórios, cada um com atributos próprios. O equipamento muda a aparência do herói.</p><p>Raridades e multiplicador de atributos:</p><div>${rar}</div><p>Armas com <b>afinidade</b> (◆ dourado) dão +15% de ATQ para a classe certa.</p>`],
 ['anc','Lendários, Míticos e Antiguidades','rune','#ff4ad8',`<p><span class="c4">Lendários</span> têm 1 efeito especial. <span class="c5">Míticos</span> têm 1 efeito 50% mais forte. <span class="c6">Antiguidades</span> são a raridade suprema: <b>2 efeitos com força dobrada</b>, +10% de ATQ/VIDA/DEF (Aura Ancestral) e o herói brilha em arco-íris na batalha.</p><p>Antiguidades caem raramente de qualquer monstro, mais no <b>Abismo Antigo</b>, ou fundindo 3 Míticos.</p><p><b>Efeitos possíveis</b> (valores de um Lendário):</p>${trs}`],
 ['forja','Forja','anvil','#8a94a4',`<p><b>Aprimorar</b>: +15% nos atributos principais por nível (até +10), custa ouro e fragmentos.<br><b>Fundir</b>: 3 itens da mesma raridade viram 1 da raridade acima.<br><b>Forjar</b>: escolha o tipo exato de item por 30 fragmentos.<br>Fragmentos vêm de <b>desmontar</b> itens na Bolsa.</p>`],
 ['mapa','Regiões','map','#e8d8b0',`<p>São ${BIO.length} regiões de ${RLEN} fases. Você começa com bichos da vila e da floresta, depois enfrenta soldados, mortos-vivos, demônios e criaturas celestiais. Quanto mais fundo, mais tipos diferentes de inimigos aparecem misturados. Depois do Trono do Caos o ciclo recomeça mais difícil (II, III...).</p>${reg}`],
 ['best','Bestiário e troféus','skull','#e8e0d0',`<p>Cada monstro derrotado é registrado no Bestiário (Mapa › Bestiário). Cada tipo pode soltar um <b>troféu exclusivo</b> (raro; mais comum em elites e chefes): cada troféu dá +1% de ATQ e VIDA para sempre. 50 abates dão +0,5% de ouro e 500 abates +0,5% de ATQ. Completar todos os troféus de uma região dá um <b>visual exclusivo</b> e 20 gemas.</p>`],
 ['cos','Visuais e pets','wing','#b01a2a',`<p><b>Visuais</b> (capas e auras) mudam a aparência e dão bônus a quem usa. Caem raramente de chefes (mais em eventos), do bestiário, do login, da torre e do chefe da guilda.</p><p><b>Pets</b> saem de ovos. O pet ativo acompanha a equipe e dá um bônus. Treine com ouro para subir de nível e use repetidos para evoluir as estrelas (até 5).</p>`],
 ['torre','Torre Infinita','up','#4ab0ff',`<p>Desafio sem chaves: suba andar por andar com 35s cada. A cada 10 andares há um chefe que dá gemas e itens. O recorde vai para o ranking. O andar 100 dá a Aura Prismática.</p>`],
 ['dun','Masmorras','key','#e8b030',`<p>Masmorras são desafios especiais: 5 ondas + chefe em 90 segundos. Itens comuns das fases têm <b>limite diário</b> (50 por dia); masmorras, torre e chefes não contam. Cada entrada gasta 1 <b>chave</b>. Você recupera 1 chave a cada 30 min (máx ${KEYMAX}) ou pode comprar na Loja.</p>${DUNS.map(d=>`<div><img src="${icon(d.g,d.c)}" class="ti"> <b>${d.n}</b> (fase ${d.req}+): ${d.d}</div>`).join('')}<p>Cada vitória aumenta a dificuldade e as recompensas.</p>`],
 ['renascer','Renascer e Runas','rune','#a35cff',`<p>A partir do <b>andar 200</b> você pode <b>renascer</b> (Loja › Runas). Você volta à fase 1 e perde ouro, melhorias, níveis, habilidades e subclasses, mas mantém equipamentos, gemas, pets, visuais, troféus e runas, e ganha <b>Essência Rúnica</b>.</p><p>Com a essência você evolui <b>runas específicas</b> no Grimório: Força, Vigor, Bastião, Fortuna, Sabedoria, Sorte, Fúria, Pressa, Precisão, Colheita (limite diário), Ferreiro (forja) e Eternidade (tempo offline).</p>`],
 ['gemas','Gemas, forja e bolsa','gem','#3a8aff',`<p><b>Gemas</b> são a moeda especial: vêm de eventos, chefe da guilda, torre, login, conquistas e bestiário (ou compra no app da loja). Com elas você amplia a <b>bolsa</b> (começa com 40, +10 por compra), compra baús, ovos, chaves e pergaminhos de proteção.</p><p>A <b>forja</b> vai até <b>+15</b>. Até +5 nunca falha; depois a chance cai (15% no +15) e falhar a partir do +10 tira 1 nível, a menos que você use um Pergaminho de Proteção.</p><p>A <b>sorte</b> é difícil: Lendários, Míticos e Antiguidades são muito raros. Melhore com Sorte (Loja), Runa da Sorte e eventos.</p><p>O <b>Mercador</b> troca o estoque a cada 4h: itens até Épico por ouro, Lendários ou melhores por gemas.</p>`],
 ['eventos','Login, missões e eventos','star','#ffd34a',`<p>Entre todo dia para a <b>recompensa diária</b> (o 7º dia dá um Baú Lendário). Há missões <b>diárias</b> (ouro e chaves) e <b>semanais</b> (gemas e ovos). De sexta a domingo acontece um <b>evento</b> diferente a cada semana (XP em dobro, Chuva de Ouro, Caçada Rara ou Invasão de Chefes), com tarefas que dão gemas e visuais. <b>Conquistas</b> dão gemas e títulos que aparecem no chat e no ranking.</p>`],
 ['social','Social: chat, ranking, guildas e amigos','crown','#ffd34a',`<p><b>Chat</b>: fale com todos que jogam pelo mesmo link. <b>Ranking</b>: por fase máxima, poder, runas ou nível. <b>Guildas</b>: crie uma (20K ouro) ou entre numa (até 20 membros). Doar ouro sobe o nível da guilda, e cada nível dá +1% de ouro e XP para todos os membros (até +30%). A guilda tem chat próprio e um <b>Chefe da Guilda</b> semanal com vida compartilhada: cada membro tem 3 ataques por dia, e se o chefe cair todos que atacaram ganham gemas, ovo, item e chance de visual.</p><p><b>Amigos</b>: toque no nome de alguém para adicionar. Quando os dois se adicionam, vocês podem trocar <b>presentes diários</b> de ouro.</p><p class="mut">Os recursos online precisam do servidor do jogo e só funcionam pelo link hospedado.</p>`],
 ['dicas','Dicas rápidas','up','#5cd65c',`<p>• Gaste PH assim que ganhar, priorizando as passivas que aumentam ATQ e as habilidades em área.<br>• Use <i>Equipar melhores</i> sempre que a Bolsa encher.<br>• Ative o auto-vender comuns para não lotar a Bolsa.<br>• Masmorras são a melhor fonte de ouro, XP e itens raros.<br>• Travou feio? Faça masmorras, torre e o bestiário; a partir do andar 200, renasça para evoluir runas.</p>`]]}
function tabWiki(){return`<div class="fr pnl"><img class="logo-big" src="${LOGO}"><h3>WIKI DO REINO</h3><div class="mut" style="font-size:16px;margin-bottom:6px">Tutorial e guia completo. Toque num tópico para abrir.</div>`+wikiSec().map(([k,t,g,c,h])=>`<div class="wk ${wikiOpen===k?'on':''}"><div class="wk-h" data-a="wiki" data-v="${k}"><img src="${icon(g,c)}"><b>${t}</b><span>${wikiOpen===k?'▲':'▼'}</span></div>${wikiOpen===k?`<div class="wk-b">${h}</div>`:''}</div>`).join('')+`<div class="btns"><button class="btn gld" data-a="tutreset">Rever tutorial guiado</button></div></div>`}

/* init */
initStatic();resize();
if(load()&&S.heroes.length){dayRoll();questRoll();rebuildParty();B.heroes.forEach(u=>u.x=u.bx-30);spawnWave();renderPanel();offlineReward((Date.now()-S.last)/1000)}
else{S=fresh();renderPanel();modal(classPick(true),true)}
hud();requestAnimationFrame(loop);netInit();setTimeout(coach,1200);setTimeout(()=>{if(S.heroes.length&&loginState().can&&!$('#modal').classList.contains('on')&&S.tut>=TUT.length)loginModal()},1600);
</script>
